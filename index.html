<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⏰ Завод будильника СамГТУ</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
            text-align: center;
        }
        .card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 20px;
            padding: 32px 24px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
        }
        .time-badge {
            font-size: 48px;
            font-weight: 800;
            color: #38bdf8;
            margin: 16px 0;
            letter-spacing: 2px;
        }
        .desc {
            color: #94a3b8;
            font-size: 15px;
            margin-bottom: 24px;
            line-height: 1.5;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 16px 20px;
            border-radius: 12px;
            font-size: 17px;
            font-weight: 700;
            text-decoration: none;
            margin-bottom: 12px;
            transition: all 0.2s;
        }
        .btn-sleep {
            background: #0284c7;
            color: white;
        }
        .btn-standard {
            background: #334155;
            color: #cbd5e1;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>⏰ Завод будильника</h2>
        <div id="time" class="time-badge">07:40</div>
        <p id="label" class="desc">СамГТУ (ОФП в 1 корп)</p>

        <a id="btn-sleep" class="btn btn-sleep" href="#">Открыть в Sleep as Android</a>
        <a id="btn-standard" class="btn btn-standard" href="#">Открыть в обычных Часах</a>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const h = parseInt(params.get('h') || '7');
        const m = parseInt(params.get('m') || '40');
        const timeStr = `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
        const labelText = params.get('label') || 'СамГТУ';

        document.getElementById('time').innerText = timeStr;
        document.getElementById('label').innerText = labelText;

        // Sleep as Android intent (with 30m smart window)
        const sleepIntent = `intent:#Intent;action=com.urbandroid.sleep.alarm.SET_ALARM;i.hour=${h};i.minute=${m};i.smart_period=30;S.alarm_label=${encodeURIComponent(labelText)};package=com.urbandroid.sleep;end`;
        // Standard Android alarm clock intent
        const standardIntent = `intent:#Intent;action=android.intent.action.SET_ALARM;i.android.intent.extra.alarm.HOUR=${h};i.android.intent.extra.alarm.MINUTES=${m};S.android.intent.extra.alarm.MESSAGE=${encodeURIComponent(labelText)};B.android.intent.extra.alarm.SKIP_UI=true;end`;

        document.getElementById('btn-sleep').href = sleepIntent;
        document.getElementById('btn-standard').href = standardIntent;

        // Auto trigger primary intent
        window.location.href = sleepIntent;
    </script>
</body>
</html>

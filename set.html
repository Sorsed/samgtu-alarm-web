<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>⏰ Завод будильника</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #090d16;
            color: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            text-align: center;
        }
        .card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 24px;
            padding: 32px 20px;
            max-width: 360px;
            width: 100%;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        }
        .time-badge {
            font-size: 52px;
            font-weight: 800;
            color: #38bdf8;
            margin: 12px 0 8px 0;
            letter-spacing: 2px;
        }
        .desc {
            color: #94a3b8;
            font-size: 15px;
            margin-bottom: 28px;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 16px 20px;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 700;
            text-decoration: none;
            margin-bottom: 12px;
            cursor: pointer;
            border: none;
            transition: transform 0.1s;
        }
        .btn:active { transform: scale(0.98); }
        .btn-sleep {
            background: #0284c7;
            color: white;
            box-shadow: 0 4px 14px rgba(2, 132, 199, 0.4);
        }
        .btn-clock {
            background: #3b82f6;
            color: white;
        }
        .note {
            font-size: 12px;
            color: #64748b;
            margin-top: 16px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h3 style="color:#94a3b8; font-weight:600;">СамГТУ Умный Будильник</h3>
        <div id="time" class="time-badge">07:40</div>
        <p id="label" class="desc">ОФП в 1 корпусе</p>

        <a id="btn-sleep" class="btn btn-sleep" href="#">🌙 Завести в Sleep as Android</a>
        <a id="btn-clock" class="btn btn-clock" href="#">⏰ Завести в обычных Часах</a>

        <p class="note">Нажмите на кнопку для моментальной установки времени</p>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const h = parseInt(params.get('h') || '7');
        const m = parseInt(params.get('m') || '40');
        const timeStr = `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
        const labelText = params.get('label') || 'СамГТУ';

        document.getElementById('time').innerText = timeStr;
        document.getElementById('label').innerText = labelText;

        // Intent for Sleep as Android Activity
        const sleepIntent = `intent:#Intent;action=android.intent.action.SET_ALARM;package=com.urbandroid.sleep;component=com.urbandroid.sleep/.alarm.SetAlarmActivity;i.android.intent.extra.alarm.HOUR=${h};i.android.intent.extra.alarm.MINUTES=${m};S.android.intent.extra.alarm.MESSAGE=${encodeURIComponent(labelText)};B.android.intent.extra.alarm.SKIP_UI=true;end`;
        
        // Universal intent for system Clock (never opens Play Store)
        const clockIntent = `intent:#Intent;action=android.intent.action.SET_ALARM;i.android.intent.extra.alarm.HOUR=${h};i.android.intent.extra.alarm.MINUTES=${m};S.android.intent.extra.alarm.MESSAGE=${encodeURIComponent(labelText)};B.android.intent.extra.alarm.SKIP_UI=true;end`;

        document.getElementById('btn-sleep').href = sleepIntent;
        document.getElementById('btn-clock').href = clockIntent;

        // Try direct launch
        setTimeout(() => {
            window.location.href = sleepIntent;
        }, 300);
    </script>
</body>
</html>
